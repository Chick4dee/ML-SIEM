name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install PyTorch (CPU) for tests
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package + dev tools
        run: pip install -e .[dev,capture]

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest
